name: OCI Free Tier Auto Apply & Notify

on:
  schedule:
    - cron: '*/30 * * * *' # Tăng lên 30 phút/lần để tránh chồng chéo
  workflow_dispatch:

# THÊM ĐOẠN NÀY ĐỂ TỰ ĐỘNG HỦY TIẾN TRÌNH CŨ NẾU TIẾN TRÌNH MỚI ĐẾN LỊCH CHẠY
concurrency:
  group: oci-free-tier-hunt
  cancel-in-progress: true

jobs:
  apply:
    name: Run Terraform Apply & Check VM Status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.12.6

      - name: Configure OCI Credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCID_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          # Tạo tệp config OCI từ các Repository Secrets của bạn
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Apply (Hunting VM)
        id: apply
        continue-on-error: true # Cho phép tiếp tục nếu lỗi hết quota để script check kết quả bên dưới
        run: tofu apply -auto-approve

      - name: Check if Instance is Actually Created
        id: check_vm
        run: |
          # Kiểm tra xem resource oci_core_instance đã thực sự tồn tại trong state hay chưa
          if tofu state list | grep -q "oci_core_instance"; then
            echo "status=created" >> $GITHUB_OUTPUT
            echo "🎉 Đã phát hiện tài nguyên máy ảo tồn tại trong Terraform state!"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "⏳ Vẫn chưa săn được VM, Oracle đang báo lỗi hết resource hoặc chưa khởi tạo."
          fi

      - name: Send Telegram Notification on Success Only
        if: steps.check_vm.outputs.status == 'created'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔥 SĂN THÀNH CÔNG OCI FREE TIER VM! 🔥
            📦 Repo: ${{ github.repository }}
            👤 Triggered by: ${{ github.actor }}
            🚀 Máy ảo ARM/AMD của bạn đã được khởi tạo thành công trên Oracle Cloud!
            🔗 Link chi tiết: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
