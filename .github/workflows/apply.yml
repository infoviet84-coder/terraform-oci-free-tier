name: OCI Free Tier Auto Apply & Notify

on:
  schedule:
    - cron: '*/15 * * * *' # Giãn cách 30 phút/lần để tránh chồng chéo
  workflow_dispatch:

concurrency:
  group: oci-free-tier-hunt
  cancel-in-progress: true # Tự động hủy tiến trình cũ nếu có tiến trình mới chạy đè lên

jobs:
  apply:
    name: Run Terraform Apply & Check VM Status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.12.6

      - name: Configure OCI Credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCID_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Apply (Hunting VM)
        id: apply
        continue-on-error: true
        timeout-minutes: 5 # GIỚI HẠN THỜI GIAN: Bắt buộc dừng lệnh apply sau 5 phút nếu Oracle không phản hồi
        run: tofu apply -auto-approve

      - name: Check if Instance is Actually Created
        id: check_vm
        run: |
          if tofu state list | grep -q "oci_core_instance"; then
            echo "status=created" >> $GITHUB_OUTPUT
            echo "🎉 Đã phát hiện tài nguyên máy ảo tồn tại trong Terraform state!"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "⏳ Vẫn chưa săn được VM, tiến trình kết thúc an toàn để chờ lượt sau."
          fi

      - name: Send Telegram Notification on Success Only
        if: steps.check_vm.outputs.status == 'created'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔥 SĂN THÀNH CÔNG OCI FREE TIER VM! 🔥
            📦 Repo: ${{ github.repository }}
            👤 Triggered by: ${{ github.actor }}
            🚀 Máy ảo của bạn đã được khởi tạo thành công trên Oracle Cloud!
            🔗 Link chi tiết: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
